version: "3.9"

services:
  arangodb:
    image: arangodb:3.11
    container_name: seia_arangodb
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: "${ARANGODB_PASSWORD:-change-me}"
    ports:
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD", "arangosh", "--server.endpoint", "http+tcp://127.0.0.1:8529", "--server.authentication", "false", "--javascript.execute-string", "db._version()"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: seia_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-seia}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-seia-secret}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  arango_data:
  minio_data:
